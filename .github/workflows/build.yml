name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
          cache-disabled: true
      - name: Build
        run: gradle build --no-daemon --refresh-dependencies
        continue-on-error: true
      - name: Diagnose
        if: always()
        run: |
          J=$(find /home/runner/.gradle/caches/fabric-loom -name "minecraft-merged-1.21.1-*.jar" ! -name "*intermediary*" | head -1)
          echo "NAMED JAR: $J"
          unzip -l "$J" 2>/dev/null | grep -E "ChunkGenerator|NoiseColumn|climate" | head -20
      - name: Fail if no jar was produced
        run: test -f build/libs/plotlands-1.0.0.jar
      - uses: actions/upload-artifact@v4
        if: hashFiles('build/libs/plotlands-1.0.0.jar') != ''
        with:
          name: plotlands-jar
          path: build/libs/plotlands-1.0.0.jar
