name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
          cache-disabled: true
      - name: Build
        run: gradle build --no-daemon --refresh-dependencies
        continue-on-error: true
      - name: Diagnose
        if: always()
        run: |
          echo "=== loom jars found ==="
          find /home/runner/.gradle/caches/fabric-loom -name "*.jar" 2>/dev/null | head -40
          for j in $(find /home/runner/.gradle/caches/fabric-loom -path "*1.21.1*" -name "*.jar" 2>/dev/null | head -6); do
            echo "=== JAR: $j ==="
            unzip -l "$j" 2>/dev/null | grep -E "world/level/levelgen/|world/level/" | head -40
          done
      - name: Fail if no jar was produced
        run: test -f build/libs/plotlands-1.0.0.jar
      - uses: actions/upload-artifact@v4
        if: hashFiles('build/libs/plotlands-1.0.0.jar') != ''
        with:
          name: plotlands-jar
          path: build/libs/plotlands-1.0.0.jar
