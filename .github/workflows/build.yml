name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
          cache-disabled: true
      - name: Build
        run: |
          gradle build --no-daemon --console=plain > build.log 2>&1 || true
          tail -n 100 build.log
      - name: Diagnose
        if: always()
        run: |
          J=$(find /home/runner/.gradle/caches/fabric-loom -name "minecraft-merged-1.21.1-*.jar" ! -name "*intermediary*" | head -1)
          echo "== VerticalBlockSample =="
          javap -cp "$J" net.minecraft.world.gen.chunk.VerticalBlockSample
          echo "== ProtoChunk =="
          javap -cp "$J" net.minecraft.world.chunk.ProtoChunk | head -30
          echo "== Identifier =="
          javap -cp "$J" net.minecraft.util.Identifier | head -12
          echo "== Registries CHUNK_GENERATOR =="
          javap -cp "$J" net.minecraft.registry.Registries | grep -i "CHUNK_GENERATOR"
          echo "== build/libs contents =="
          ls -la build/libs || true
      - name: Fail if no jar was produced
        run: test -f build/libs/plotlands-1.0.0.jar
      - uses: actions/upload-artifact@v4
        if: hashFiles('build/libs/plotlands-1.0.0.jar') != ''
        with:
          name: plotlands-jar
          path: build/libs/plotlands-1.0.0.jar
